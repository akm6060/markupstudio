name: Emulator test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [24, 28, 30, 34]
    steps:
      - uses: actions/checkout@v5

      - name: Get APK
        run: |
          git clone -q --depth 1 -b apk "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apkdir
          cp apkdir/MarkupStudio.apk .

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          ram-size: 3072M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/test/emu.sh ${{ matrix.api }}

      - name: Publish logs
        if: always()
        run: |
          mkdir out && cd out
          for f in s1-start.png s2-browser.png s3-download.png s4-doc.png s5-search.png s6-big.png s7-book.png s8a-scroll.png s8-scroll.png s9-selftest.png files.txt mem.txt crash.txt full.txt resumed.txt pid.txt ui-last.xml; do [ -f ../$f ] && cp ../$f ./api${{ matrix.api }}-$f; done; cp ../ui-notfound-*.xml . 2>/dev/null || true
          grep -E "AndroidRuntime|chromium|MarkupStudio|markupstudio|FATAL|Console|MSRange|SELFTEST|lowmemorykiller|onTrimMemory" ../full.txt > api${{ matrix.api }}-filtered.txt || true
          git init -q -b testlog-${{ matrix.api }}
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "emulator log api ${{ matrix.api }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" testlog-${{ matrix.api }}
