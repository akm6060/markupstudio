name: Emulator test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [24, 28, 30, 34]
    steps:
      - name: Get APK
        run: |
          git clone -q --depth 1 -b apk "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apkdir
          cp apkdir/MarkupStudio.apk .

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r MarkupStudio.apk
            adb logcat -c
            adb shell am start -W -n com.markupstudio.reader/.MainActivity || true
            sleep 8
            adb exec-out screencap -p > screen1.png || true
            sleep 17
            adb shell dumpsys activity activities | grep -i -E "mResumedActivity|topResumedActivity" > resumed.txt || true
            adb shell pidof com.markupstudio.reader > pid.txt || echo none > pid.txt
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d > full.txt || true
            adb exec-out screencap -p > screen.png || true

      - name: Publish logs
        if: always()
        run: |
          mkdir out && cd out
          for f in screen1.png crash.txt full.txt resumed.txt pid.txt screen.png; do [ -f ../$f ] && cp ../$f ./api${{ matrix.api }}-$f; done
          grep -E "AndroidRuntime|chromium|MarkupStudio|markupstudio|FATAL|Console" ../full.txt > api${{ matrix.api }}-filtered.txt || true
          git init -q -b testlog-${{ matrix.api }}
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "emulator log api ${{ matrix.api }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" testlog-${{ matrix.api }}
