name: Build Fresh

on:
  push:
    branches: [fresh]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Libraries
        run: bash scripts/fetch-libs.sh
      - name: Make JavaScript work on old Android WebViews
        run: |
          npm install --no-save --no-audit --no-fund typescript@5.4.5
          A=app/src/main/assets
          node scripts/downlevel.js $A/libs/pdf.min.js $A/libs/pdf.worker.min.js $A/js/*.js
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MarkupStudio.apk
      - name: Publish APK
        run: |
          mkdir out && cp MarkupStudio.apk out/MarkupStudio-Fresh.apk && cd out
          git init -q -b apk-fresh
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-fresh
      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: MarkupStudio.apk

  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [24, 28, 30, 34]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          ram-size: 3072M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/test/emu.sh ${{ matrix.api }}
      - name: Publish logs
        if: always()
        run: |
          mkdir out && cd out
          for f in ../*.png ../*.txt ../ui-*.xml; do [ -f "$f" ] && cp "$f" ./api${{ matrix.api }}-$(basename $f); done
          grep -E "AndroidRuntime|chromium|MarkupStudio|markupstudio|FATAL|Console|MSRange|SELFTEST|lowmemorykiller|onTrimMemory" ../full.txt > api${{ matrix.api }}-filtered.txt || true
          git init -q -b testlog-fresh-${{ matrix.api }}
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "emulator log api ${{ matrix.api }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" testlog-fresh-${{ matrix.api }}
