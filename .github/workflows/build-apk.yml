name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Android SDK (preinstalled on runner)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Fetch offline JavaScript libraries
        run: bash scripts/fetch-libs.sh

      - name: Make JavaScript work on old Android WebViews
        run: |
          npm install --no-save --no-audit --no-fund typescript@5.4.5
          A=app/src/main/assets
          node scripts/downlevel.js $A/libs/pdf.min.js $A/libs/pdf.worker.min.js $A/app.js $A/native.js $A/reader-core.js $A/saver.js $A/native-pre.js

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MarkupStudio.apk

      - uses: actions/upload-artifact@v5
        with:
          name: MarkupStudio-apk
          path: MarkupStudio.apk

      - name: Publish APK to apk branch
        run: |
          mkdir out && cp MarkupStudio.apk out/ && cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add MarkupStudio.apk
          git commit -q -m "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
